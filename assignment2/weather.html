<!DOCTYPE html>
<html>

<head>
    <title>Weather Finder</title>

    <style>
        body {
            font-family: Arial;
            text-align: center;
            background-color: #d9f0ff;
        }

        .card {
            background: white;
            width: 320px;
            margin: 20px auto;
            padding: 15px;
            border-radius: 10px;
        }

        input {
            padding: 7px;
            width: 70%;
        }

        button {
            padding: 7px;
            margin-top: 8px;
            cursor: pointer;
        }

        .history button {
            margin: 4px;
        }
    </style>
</head>

<body>

    <h2>Weather Finder</h2>

    <div class="card">
        <input id="inputCity" placeholder="Enter city name">
        <br>
        <button onclick="findWeather()">Search</button>

        <h3>Search History</h3>
        <div id="pastData" class="history"></div>
    </div>

    <div class="card">
        <h3>Weather Info</h3>
        <div id="result"></div>
    </div>

    <script src="script.js"></script>

</body>

</html>
